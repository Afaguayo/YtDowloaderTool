name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on version tags

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: python build.py
      - name: Self-test the .exe (ffmpeg, Deno, yt-dlp, interface all bundled)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\YTDownloader.exe -ArgumentList '--selftest','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Try a real download with the .exe (YouTube often blocks cloud servers, so this can't fail the build)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\YTDownloader.exe -ArgumentList '--selftest','download.txt','--selftest-download' -Wait -PassThru
          Get-Content download.txt
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-Windows
          path: dist/YTDownloader.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YTDownloader.exe
