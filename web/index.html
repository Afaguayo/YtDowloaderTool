<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Downloader</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --faint: #86868b;
    --line: rgba(0, 0, 0, 0.08);
    --field: rgba(118, 118, 128, 0.12);
    --accent: #ff3b30;
    --accent-press: #d70015;
    --ok: #34c759;
    --track: rgba(118, 118, 128, 0.18);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --faint: #8e8e93;
      --line: rgba(255, 255, 255, 0.1);
      --field: rgba(118, 118, 128, 0.24);
      --accent: #ff453a;
      --accent-press: #ff6961;
      --ok: #30d158;
      --track: rgba(118, 118, 128, 0.32);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, select, input { font: inherit; color: inherit; }
  main { max-width: 760px; margin: 0 auto; padding: 30px 24px 40px; }

  h1 {
    margin: 0; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; gap: 10px;
  }
  h1 .logo { width: 34px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
  .subtitle { color: var(--muted); margin-top: 6px; }

  /* ---------- input ---------- */
  .panel { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; margin-top: 22px; }
  .field {
    display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 12px;
    border-radius: 12px; background: var(--field); transition: box-shadow .15s;
  }
  .field:focus-within { box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 35%, transparent); }
  .field svg { flex: none; color: var(--faint); }
  .field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
  .field input::placeholder { color: var(--faint); }
  .ghost { border: 0; background: none; cursor: pointer; color: var(--accent); padding: 6px 10px; border-radius: 8px; font-weight: 500; }
  .ghost:hover { background: var(--field); }

  .options { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .segmented { display: inline-flex; background: var(--field); border-radius: 10px; padding: 2px; }
  .segmented button {
    border: 0; background: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500;
  }
  .segmented button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  select {
    height: 34px; border-radius: 10px; border: 0; background: var(--field); padding: 0 10px; cursor: pointer;
  }
  select:disabled { opacity: .45; cursor: default; }
  .spacer { flex: 1; }
  .btn {
    height: 40px; border: 0; border-radius: 12px; padding: 0 20px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; transition: background .15s, opacity .15s;
  }
  .btn:hover { background: var(--accent-press); }
  .btn:disabled { opacity: .4; cursor: default; background: var(--accent); }

  /* ---------- preview ---------- */
  .preview { display: none; gap: 14px; margin-top: 16px; align-items: center; }
  .preview.show { display: flex; }
  .thumb { width: 128px; aspect-ratio: 16 / 9; border-radius: 10px; object-fit: cover; background: var(--field); flex: none; }
  .meta { min-width: 0; }
  .meta .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .meta .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .message { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .message.error { color: var(--accent); }

  /* ---------- jobs ---------- */
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 4px 10px; }
  .section-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .jobs { display: grid; gap: 10px; }
  .job { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; display: flex; gap: 12px; align-items: center; }
  .job .thumb { width: 96px; }
  .job .meta { flex: 1; }
  .bar { height: 5px; border-radius: 3px; background: var(--track); margin-top: 8px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s; }
  .job.done .bar div { background: var(--ok); }
  .job.error .sub { color: var(--accent); }
  .job.processing .bar div { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .empty { color: var(--faint); text-align: center; padding: 30px 0; }

  /* ---------- footer ---------- */
  .footer { margin-top: 26px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .footer code { background: var(--field); padding: 3px 7px; border-radius: 6px; color: var(--text); word-break: break-all; }
  .notice { margin-top: 14px; font-size: 13px; color: var(--muted); background: var(--field); border-radius: 10px; padding: 10px 12px; display: none; }
  .notice.show { display: block; }
</style>
</head>
<body>
<main>
  <h1><span class="logo"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="#fff"/></svg></span>YT Downloader</h1>
  <div class="subtitle">Paste a YouTube link to save it as an MP4 video or MP3 audio.</div>

  <div class="panel">
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false">
      <button class="ghost" id="paste" type="button">Paste</button>
    </div>

    <div class="preview" id="preview">
      <img class="thumb" id="p-thumb" alt="">
      <div class="meta"><div class="title" id="p-title"></div><div class="sub" id="p-sub"></div></div>
    </div>
    <div class="message" id="message"></div>

    <div class="options">
      <div class="segmented" role="group" aria-label="What to download">
        <button type="button" id="mode-video" class="on">MP4 · Video</button>
        <button type="button" id="mode-audio">MP3 · Audio</button>
      </div>
      <select id="quality" aria-label="Quality"></select>
      <span class="spacer"></span>
      <button class="btn" id="go" disabled>Download</button>
    </div>
    <div class="notice" id="ffmpeg-notice">
      ffmpeg wasn't found, so video is limited to single-file formats (usually 720p or lower) and audio is saved as M4A instead of MP3. Fix it with <code>pip install -r requirements.txt</code>.
    </div>
  </div>

  <div class="section-head">
    <h2>Downloads</h2>
    <button class="ghost" id="clear" type="button">Clear finished</button>
  </div>
  <div class="jobs" id="jobs"><div class="empty">Nothing yet.</div></div>

  <div class="footer">
    Saving to <code id="folder">…</code>
    <button class="ghost" id="change" type="button">Change</button>
    <button class="ghost" id="open" type="button">Open folder</button>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { audio: false, preview: null, lookupId: 0, jobs: [] };

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function duration(sec) {
  if (!sec && sec !== 0) return "";
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
function size(bytes) {
  if (!bytes) return "";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return bytes.toFixed(i ? 1 : 0) + " " + units[i];
}
function isYouTube(text) {
  try {
    const u = new URL(text.trim());
    return /^(www\.|m\.|music\.)?(youtube\.com|youtu\.be)$/i.test(u.hostname);
  } catch { return false; }
}
async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Ytdl": "1" }, body: JSON.stringify(body || {}) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}
function say(text, isError) {
  $("message").textContent = text || "";
  $("message").classList.toggle("error", !!isError);
}

// ---------- mode + quality ----------
function setMode(audio) {
  state.audio = audio;
  $("mode-video").classList.toggle("on", !audio);
  $("mode-audio").classList.toggle("on", audio);
  $("quality").disabled = audio;
}
$("mode-video").onclick = () => setMode(false);
$("mode-audio").onclick = () => setMode(true);

// ---------- link preview ----------
let lookupTimer;
function onUrlInput() {
  const text = $("url").value.trim();
  clearTimeout(lookupTimer);
  state.preview = null;
  $("preview").classList.remove("show");
  $("go").disabled = !isYouTube(text);
  if (!text) return say("");
  if (!isYouTube(text)) return say("That doesn't look like a YouTube link.", true);
  say("Looking it up…");
  lookupTimer = setTimeout(() => lookup(text), 400);
}
async function lookup(text) {
  const id = ++state.lookupId;
  try {
    const res = await fetch("/api/info?url=" + encodeURIComponent(text));
    const info = await res.json();
    if (id !== state.lookupId) return;           // the link changed meanwhile
    if (!res.ok) throw new Error(info.error);
    state.preview = info;
    $("p-thumb").src = info.thumbnail || "";
    $("p-title").textContent = info.title || text;
    $("p-sub").textContent = info.playlist
      ? `Playlist · ${info.count} video${info.count === 1 ? "" : "s"}`
      : [info.channel, duration(info.duration)].filter(Boolean).join(" · ");
    $("preview").classList.add("show");
    say("");
  } catch (err) {
    if (id === state.lookupId) say(err.message || "Couldn't look up that link.", true);
  }
}
$("url").addEventListener("input", onUrlInput);
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("go").disabled) start(); });
$("paste").onclick = async () => {
  try {
    $("url").value = (await navigator.clipboard.readText()).trim();
    onUrlInput();
  } catch {
    $("url").focus();
    say("Press ⌘V / Ctrl+V to paste.");
  }
};

// ---------- downloads ----------
async function start() {
  const url = $("url").value.trim();
  if (!isYouTube(url)) return;
  const p = state.preview;
  try {
    await post("/api/download", {
      url, audio: state.audio, quality: $("quality").value,
      title: p && p.title, thumbnail: p && p.thumbnail,
    });
    $("url").value = "";
    onUrlInput();
    refresh();
  } catch (err) { say(err.message, true); }
}
$("go").onclick = start;

function statusLine(job) {
  switch (job.state) {
    case "queued": return "Waiting…";
    case "downloading": {
      const parts = [];
      if (job.count > 1 && job.index) parts.push(`Video ${job.index} of ${job.count}`);
      if (job.percent != null) parts.push(Math.round(job.percent) + "%");
      if (job.speed) parts.push(size(job.speed) + "/s");
      if (job.eta != null) parts.push(duration(job.eta) + " left");
      return parts.join(" · ") || "Starting…";
    }
    case "processing": return job.audio ? "Converting to MP3…" : "Merging video and audio…";
    case "done": return "Saved" + (job.count > 1 ? ` · ${job.count} videos` : "");
    case "error": return job.error || "Failed";
  }
  return "";
}
function render() {
  const box = $("jobs");
  if (!state.jobs.length) { box.innerHTML = '<div class="empty">Nothing yet.</div>'; return; }
  box.innerHTML = state.jobs.map((job) => `
    <div class="job ${esc(job.state)}">
      ${job.thumbnail ? `<img class="thumb" src="${esc(job.thumbnail)}" alt="">` : '<div class="thumb"></div>'}
      <div class="meta">
        <div class="title">${esc(job.title)}</div>
        <div class="sub">${job.audio ? "MP3" : "MP4" + (job.quality !== "best" ? " · " + esc(job.quality) + "p" : "")} · ${esc(statusLine(job))}</div>
        <div class="bar"><div style="width:${job.state === "error" ? 0 : Math.max(2, job.percent || 0)}%"></div></div>
      </div>
    </div>`).join("");
}

let pollTimer;
async function refresh() {
  clearTimeout(pollTimer);
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    state.jobs = data.jobs;
    $("folder").textContent = data.folder;
    $("ffmpeg-notice").classList.toggle("show", !data.ffmpeg);
    if (!$("quality").options.length) {
      $("quality").innerHTML = data.qualities.map((q) =>
        `<option value="${q}">${q === "best" ? "Best quality" : q + "p"}</option>`).join("");
    }
    render();
  } catch { /* server restarting; try again shortly */ }
  const busy = state.jobs.some((j) => ["queued", "downloading", "processing"].includes(j.state));
  pollTimer = setTimeout(refresh, busy ? 600 : 2500);
}

$("clear").onclick = () => post("/api/clear").then(refresh);
$("open").onclick = () => post("/api/open-folder").catch((e) => say(e.message, true));
$("change").onclick = async () => {
  let folder = null;
  if (window.pywebview && window.pywebview.api) folder = await window.pywebview.api.choose_folder();
  else folder = prompt("Save downloads to which folder?", $("folder").textContent);
  if (!folder) return;
  try { await post("/api/folder", { folder }); refresh(); } catch (err) { say(err.message, true); }
};

refresh();
$("url").focus();
</script>
</body>
</html>
